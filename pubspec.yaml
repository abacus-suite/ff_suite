name: field_force_app
description: Field Force by ABS - field force app for sales officers and managers (Odoo 19 backend).
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: 11.1.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  image: ^4.9.2
  battery_plus: ^7.1.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  # The foreground PNG already has its safe-zone padding; no extra shrink.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
